services:
  - type: web
    name: smart-buy-ai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FEED_REGISTRY_URL
        value: https://raw.githubusercontent.com/mixa84065-a11y/SMART-BUY-AI/main/catalog/feeds.json
      - key: API_KEY
        generateValue: true
