name: Build SMART BUY AI Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          test -f SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip || (echo 'Upload SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip to the repository root first' && exit 1)
          unzip -oq SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip -d .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest -q backend/tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent signing key
        env:
          SMARTBUY_KEYSTORE_BASE64: ${{ secrets.SMARTBUY_KEYSTORE_BASE64 }}
        run: |
          test -n "$SMARTBUY_KEYSTORE_BASE64" || (echo 'Add SMARTBUY_KEYSTORE_BASE64 repository secret first' && exit 1)
          echo "$SMARTBUY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartbuy-release.jks"
      - name: Build signed release APK
        env:
          SMARTBUY_KEYSTORE_PATH: ${{ runner.temp }}/smartbuy-release.jks
          SMARTBUY_KEYSTORE_PASSWORD: ${{ secrets.SMARTBUY_KEYSTORE_PASSWORD }}
          SMARTBUY_KEY_ALIAS: ${{ secrets.SMARTBUY_KEY_ALIAS }}
          SMARTBUY_KEY_PASSWORD: ${{ secrets.SMARTBUY_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SMART-BUY-AI-v0.5.2-release
          path: app/build/outputs/apk/release/app-release.apk
