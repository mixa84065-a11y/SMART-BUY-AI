name: Build SMART BUY AI Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          test -f SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip || (echo 'Upload SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip to the repository root first' && exit 1)
          unzip -oq SMART_BUY_AI_v0_5_2_GitHub_Source_SAFE.zip -d .
      - name: Apply SMART BUY AI v0.5.3 updates
        run: python patches/apply_v053.py
      - name: Apply SMART BUY AI v0.5.4 updates
        run: python patches/apply_v054.py
      - name: Apply SMART BUY AI v0.5.5 remote catalog updates
        run: python patches/apply_v055.py
      - name: Apply SMART BUY AI v0.5.6 YML importer improvements
        run: python patches/apply_v056.py
      - name: Apply SMART BUY AI v0.5.7 feed refresh reliability
        run: python patches/apply_v057.py
      - name: Apply SMART BUY AI v0.5.8 CSV feed support
        run: python patches/apply_v058.py
      - name: Apply SMART BUY AI v0.5.9 remote feed registry
        run: python patches/apply_v059.py
      - name: Apply SMART BUY AI v0.5.10 backend write protection
        run: python patches/apply_v0510.py
      - name: Apply SMART BUY AI v0.5.11 PostgreSQL support
        run: python patches/apply_v0511.py
      - name: Apply SMART BUY AI v0.6.0 purple mockup redesign
        run: python patches/apply_v0514.py
      - name: Apply SMART BUY AI v0.6.1 launcher icon and version update
        run: python patches/apply_v0515.py
      - name: Apply SMART BUY AI v0.6.3 live Plati catalogue search
        run: python patches/apply_v0522.py
      - name: Apply SMART BUY AI v0.6.4 universal product cards and feed images
        run: python patches/apply_v0524.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Verify Render backend Docker image
        run: docker build -f Dockerfile.render -t smart-buy-ai-api:ci .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent signing key
        env:
          SMARTBUY_KEYSTORE_BASE64: \${{ secrets.SMARTBUY_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, re
          raw = os.environ["SMARTBUY_KEYSTORE_BASE64"].strip()
          if raw.startswith("data:") and "," in raw:
              raw = raw.split(",", 1)[1]
          raw = re.sub(r"\\s+", "", raw).replace("-", "+").replace("_", "/")
          raw = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          raw += "=" * (-len(raw) % 4)
          data = base64.b64decode(raw, validate=True)
          if len(data) < 1024:
              raise SystemExit("Decoded signing keystore is unexpectedly small")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "smartbuy-release.jks"), "wb") as f:
              f.write(data)
          PY
          keytool -list -keystore "$RUNNER_TEMP/smartbuy-release.jks" -storepass "$SMARTBUY_KEYSTORE_PASSWORD" >/dev/null
      - name: Build signed release APK
        env:
          SMARTBUY_KEYSTORE_PATH: \${{ runner.temp }}/smartbuy-release.jks
          SMARTBUY_KEYSTORE_PASSWORD: \${{ secrets.SMARTBUY_KEYSTORE_PASSWORD }}
          SMARTBUY_KEY_ALIAS: \${{ secrets.SMARTBUY_KEY_ALIAS }}
          SMARTBUY_KEY_PASSWORD: \${{ secrets.SMARTBUY_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SMART-BUY-AI-v0.6.4-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish unpacked source for maintenance
        uses: actions/upload-artifact@v4
        with:
          name: SMART-BUY-AI-source-v0.6.4
          path: |
            app/
            backend/
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradle/
          if-no-files-found: error
